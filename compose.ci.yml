services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
  spree:
    image: ghcr.io/spree/spree:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres@postgres:5432/spree_e2e
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY_BASE: e2e_secret_key_base_not_for_production_use_only
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      RAILS_HOST: localhost:3000
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/up || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
