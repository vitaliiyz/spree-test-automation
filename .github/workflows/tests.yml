name: Tests

on:
  push:
    branches:
      - main
      - test/add-login-page
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout Spree storefront
        uses: actions/checkout@v7
        with:
          repository: spree/storefront
          path: spree-storefront

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: spree-storefront/package.json

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spree-storefront/pnpm-lock.yaml

      - name: Install storefront dependencies
        working-directory: spree-storefront
        run: pnpm install --frozen-lockfile

      - name: Pull Docker images
        run: docker compose -f compose.ci.yml pull

      - name: Run Docker images
        run: docker compose -f compose.ci.yml up -d --wait

      - name: Verify Spree health
        run: curl --fail http://localhost:3000/up

      - name: Seed Spree database
        run: docker compose -f compose.ci.yml exec -T spree bin/rails db:seed

      - name: Stop Docker
        if: always()
        run: docker compose -f compose.ci.yml down -v
