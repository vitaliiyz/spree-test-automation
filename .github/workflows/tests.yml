name: Tests

on:
  push:
    branches:
      - main
      - test/add-login-page
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pull Docker images
        run: docker compose -f compose.ci.yml pull

      - name: Run Docker images
        run: docker compose -f compose.ci.yml up -d --wait

      - name: Verify Spree health
        run: curl --fail http://localhost:3000/up

      - name: Stop Docker
        if: always()
        run: docker compose -f compose.ci.yml down -v
