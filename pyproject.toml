[project]
name = "spree-test-automation"
version = "0.1.0"
description = "A test automation framework for Spree Commerce"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.49.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "requests>=2.34.2",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # Pycodestyle errors
    "F",   # Pyflakes
    "I",   # Import sorting
    "B",   # Bugbear checks
    "UP",  # Python syntax upgrades
    "RUF", # Ruff-specific rules
    "PT",  # Pytest style checks
]

[tool.pytest.ini_options]
base_url = "https://demo.spreecommerce.org"
pythonpath = ["."]
